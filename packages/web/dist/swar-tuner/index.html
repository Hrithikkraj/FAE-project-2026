<body>
    <div class="header-container tool-header">
    
        <div class="tool-nav-wrapper">
            <a href="/" class="brand-link">Swara</a>
            <span class="tool-name-label">Swar Tuner</span>
        </div>
    

    
    <button aria-label="Toggle Dark Mode" class="theme-btn-header theme-toggle">
        <!-- Sun Icon (Visible in Dark Mode) -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <!-- Moon Icon (Visible in Light Mode) -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    
</div>

    <main class="st-page">
        <section class="st-workspace" aria-label="Swar tuner">
            <div class="st-graph-card">
                <canvas id="pitch-canvas" aria-label="Scrolling pitch graph"></canvas>
            </div>

            <aside class="st-panel" aria-live="polite">
                <div class="st-panel-label">NOW SINGING</div>
                <div class="st-note-row">
                    <span id="current-swar" class="st-note-name st-is-silent">--</span>
                    <span id="current-octave" class="st-octave"></span>
                </div>
                <div id="cents-display" class="st-cents">--</div>

                <div class="st-cents-meter" aria-label="Cents deviation from the swar">
                    <div class="st-cents-track">
                        <span class="st-zone st-zone-out-low"></span>
                        <span class="st-zone st-zone-warn-low"></span>
                        <span class="st-zone st-zone-good"></span>
                        <span class="st-zone st-zone-warn-high"></span>
                        <span class="st-zone st-zone-out-high"></span>
                        <span id="cents-thumb" class="st-cents-thumb st-is-muted"></span>
                    </div>
                    <div class="st-cents-labels" aria-hidden="true">
                        <span>-50</span><span>-30</span><span>-15</span><span>0</span><span>+15</span><span>+30</span><span>+50</span>
                    </div>
                </div>

                <div id="tuner-status" class="st-status" data-status="silent">--</div>
                <div id="frequency-display" class="st-frequency">--</div>
            </aside>
        </section>

        <div class="st-bottom-bar">
            <button id="start-btn" class="st-listen-btn" type="button">Start Listening</button>
            <span id="bottom-frequency" class="st-bottom-frequency">--</span>
            <p class="st-hint">Humming is recommended for better stability.</p>
        </div>
    </main>

</footer>
